<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria Tutorial</title>
  <link rel="icon" href="../images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #070a10;
      --border: #1a2035;
      --text: #c8d4e8;
      --accent: #3a7bff;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'Sora', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      max-width: 1024px;
      margin: 0 auto;
      width: 100%;
    }

    .content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.5rem;
      width: 100%;
    }

    .hero {
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    .hero h1 {
      font-family: 'Orbitron', monospace;
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: white;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      font-size: 1.125rem;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
    }

    .solutions {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      width: 100%;
      max-width: 900px;
    }

    .solution-item {
      background: #0b0f18;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      animation: fadeInUp 0.7s ease-out;
      animation-fill-mode: both;
    }

    .solution-item:nth-child(1) { animation-delay: 0.2s; }
    .solution-item:nth-child(2) { animation-delay: 0.35s; }
    .solution-item:nth-child(3) { animation-delay: 0.5s; }
    .solution-item:nth-child(4) { animation-delay: 0.65s; }
    .solution-item:nth-child(5) { animation-delay: 0.8s; }

    .solution-item::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
    }

    .solution-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 30px rgba(58, 123, 255, 0.25);
      border-color: rgba(58, 123, 255, 0.4);
    }

    .solution-text {
      margin-bottom: 1rem;
      font-size: 1rem;
      line-height: 1.6;
    }

    .solution-text h3 {
      font-family: 'Orbitron', monospace;
      font-size: 1.125rem;
      font-weight: 600;
      color: white;
      margin-bottom: 0.5rem;
    }

    .solution-text p {
      font-size: 0.875rem;
      opacity: 0.6;
    }

    .solution-image {
      width: 100%;
      max-width: 500px;
      height: auto;
      border-radius: 0.5rem;
      border: 1px solid rgba(58, 123, 255, 0.2);
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0px rgba(58, 123, 255, 0); }
      50%       { box-shadow: 0 0 18px rgba(58, 123, 255, 0.3); }
    }

    .footer-line {
      height: 2px; width: 100%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.2;
    }
  </style>
</head>
<body>

<!-- ── MAIN PAGE ── -->
<div class="container">
  <div class="content-wrapper">
    <div class="hero">
      <h1>Hvorfor starter ikke nedlastningen din?</h1>
    </div>

    <div class="solutions">
      <div class="solution-item">
        <div class="solution-text">
          <h3>Steg 1</h3>
          <p>Trykk denne knappen.</p>
        </div>
        <img src="1.png" alt="Solution 1" class="solution-image">
      </div>

      <div class="solution-item">
        <div class="solution-text">
          <h3>Steg 2</h3>
          <p>Trykk tannjulet</p>
        </div>
        <img src="2.png" alt="Solution 2" class="solution-image">
      </div>

      <div class="solution-item">
        <div class="solution-text">
          <h3>Steg 3</h3>
          <p>Bla helt ned til du finner Om ChromeOS.</p>
        </div>
        <img src="3.png" alt="Solution 3" class="solution-image">
      </div>

      <div class="solution-item">
        <div class="solution-text">
          <h3>Steg 4</h3>
          <p>Trykk Om ChromeOS knappen.</p>
        </div>
        <img src="4.png" alt="Solution 4" class="solution-image">
      </div>

      <div class="solution-item">
        <div class="solution-text">
          <h3>Steg 5</h3>
          <p>Trykk på se etter oppdateringer og vent til den har lastet ned oppdateringen, så start pcen på nytt.</p>
        </div>
        <img src="5.png" alt="Solution 5" class="solution-image">
      </div>
    </div>
  </div>
</div>

<div class="footer-line"></div>

</body>
</html>
