
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puter AI Chatbot</title>
</head>
<body>
  <div id="status">Loading chatbot...</div>
  <div id="app"></div>

  <script>
    async function loadChatbot() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(
          "https://chatbot.andrio-hoyset.workers.dev/chat.html"
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const html = await response.text();

        // Display the fetched page as a separate document.
        const blob = new Blob([html], {
          type: "text/html"
        });

        const localPage = URL.createObjectURL(blob);
        location.replace(localPage);
      } catch (error) {
        status.textContent =
          "Could not load chatbot: " + error.message;
      }
    }

    loadChatbot();
  </script>
</body>
</html>
